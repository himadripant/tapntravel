spring:
  application:
    name: tapntravel
  datasource:
    url: jdbc:h2:mem:tapntravel
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  batch:
    job:
      enabled: true
    jdbc:
      initialize-schema: "always"


